# NetaTrack India - Nginx Configuration
# Ubuntu 24.04 + Nginx + PHP 8.3

server {
    listen 80;
    listen [::]:80;
    server_name netatrack.in www.netatrack.in;
    root /var/www/netatrack/php;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Uploads (no PHP execution)
    location /uploads {
        alias /var/www/netatrack/uploads;
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block sensitive
    location ~ /\.(?!well-known) { deny all; }
    location ~ /(composer\.json|composer\.lock|\.env) { deny all; }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    location /api/ {
        limit_req zone=api burst=10 nodelay;
    }

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
